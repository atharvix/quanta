services:
  postgres:
    image: postgres:16-alpine
    container_name: quanta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quanta_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quanta_secure_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-quanta_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quanta_admin} -d ${POSTGRES_DB:-quanta_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-engine:
    build:
      context: ./services/ai-engine
      dockerfile: Dockerfile
    container_name: quanta-ai-engine
    restart: unless-stopped
    environment:
      - AI_ENGINE_HOST=0.0.0.0
      - AI_ENGINE_PORT=8000
      - ENVIRONMENT=${ENVIRONMENT:-development}
    ports:
      - "${AI_ENGINE_PORT:-8000}:8000"
    volumes:
      - ./services/ai-engine:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Optimization Engine (Member 2) — enabled by default on port 8001.
  optimization-engine:
    build:
      context: ./services/optimization-engine
      dockerfile: Dockerfile
    container_name: quanta-optimization-engine
    environment:
      - OPTIMIZATION_ENGINE_PORT=8001
      - ENVIRONMENT=${ENVIRONMENT:-development}
    ports:
      - "${OPTIMIZATION_ENGINE_PORT:-8001}:8001"
    volumes:
      - ./services/optimization-engine:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: quanta-backend
    restart: unless-stopped
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://${POSTGRES_USER:-quanta_admin}:${POSTGRES_PASSWORD:-quanta_secure_dev_password}@postgres:5432/${POSTGRES_DB:-quanta_db}?sslmode=disable
      - AI_ENGINE_URL=http://ai-engine:8000
      - OPTIMIZATION_ENGINE_URL=http://optimization-engine:8001
      - JWT_SECRET=${JWT_SECRET:-dev-only-change-me-please}
      - JWT_TTL=${JWT_TTL:-1h}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      ai-engine:
        condition: service_started
      optimization-engine:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
    container_name: quanta-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
