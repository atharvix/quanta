<!doctype html>
<html lang="en" data-radius="sharp">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="page-type" content="software" />
		<meta name="site-kind" content="software" />
		<meta name="description" content="QUANTA — Corporate treasury balance sheets, Bayesian risk inference, and classical vs. QAOA optimization." />
		<meta name="theme-color" content="#f8f9fa" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..500&display=swap" rel="stylesheet" />
		<script>
			try {
				var saved = localStorage.getItem('quanta_theme') || 'light';
				var resolved = saved === 'system'
					? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
					: saved;
				document.documentElement.setAttribute('data-theme', resolved);
				document.documentElement.classList.add('theme-' + resolved);
				document.documentElement.style.colorScheme = resolved;
			} catch (_) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
